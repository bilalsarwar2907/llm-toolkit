# catalog.toml
#
# Curated model catalog for llm-toolkit v1.
# Ownership: project maintainer (D-06).
# Update cadence: release-driven. No dynamic discovery in v1.
#
# Fields:
#   repo_id         — HuggingFace repository (owner/repo)
#   filename        — exact GGUF filename within that repo
#   parameter_count — human-readable size label (e.g. "7B")
#   quant           — quantization level (e.g. "Q4_K_M")
#   approx_size_gb  — approximate download size in GiB
#   category        — "recommended" or "advanced"
#   min_ram_gb      — minimum system RAM required to run safely
#
# D-05: 32B models must have category = "advanced".
#       The recommendation engine filters them out for systems with <= 24 GB RAM.

[[models]]
repo_id         = "bartowski/Llama-3.2-3B-Instruct-GGUF"
filename        = "Llama-3.2-3B-Instruct-Q4_K_M.gguf"
parameter_count = "3B"
quant           = "Q4_K_M"
approx_size_gb  = 2.0
category        = "recommended"
min_ram_gb      = 4

